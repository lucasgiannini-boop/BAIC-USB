name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify installable signed APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BAIC-USB-diagnostico.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/BAIC-USB-diagnostico.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/BAIC-USB-diagnostico.apk | tee dist/apk-info.txt
          grep -q "package: name='com.baicusb.diagnostico'" dist/apk-info.txt
          grep -q "launchable-activity:" dist/apk-info.txt
          cd dist
          sha256sum BAIC-USB-diagnostico.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BAIC-USB-diagnostico
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "diagnostico-${{ github.run_number }}-${{ github.run_attempt }}" dist/* --target "${{ github.sha }}" --title "BAIC USB Diagnóstico · compilación ${{ github.run_number }}" --notes "APK de diagnóstico USB para Android 6 o posterior. No duplica pantalla. Compilación y lint verificados; conexión física al vehículo pendiente de prueba. APK firmado con clave de depuración temporal: para cambiar de compilación puede ser necesario desinstalar la anterior."
